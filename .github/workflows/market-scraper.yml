name: MSGKO Market Scraper

on:
  schedule:
    # Her 5 dakikada bir (GitHub Actions min. 5 dk)
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # 10 kanal x ~65sn = ~11 dk, biraz marj

    steps:
      - name: Kodu cek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'

      - name: Bagimliliklar
        run: pip install -r scripts/requirements.txt

      - name: Playwright Chromium
        run: python -m playwright install chromium --with-deps

      - name: Scraper calistir
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PYTHONUTF8: "1"
        run: python -X utf8 scripts/scrape_market.py

      - name: Debug screenshotlari yukle (hata durumunda)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: scripts/debug_*.png
          retention-days: 1
          if-no-files-found: ignore
