name: MSGKO Market Scraper

on:
  schedule:
    # Her 5 dakikada bir — UTC saat (Türkiye = UTC+3)
    # GitHub Actions minimum 5 dakika destekliyor
    - cron: '*/5 * * * *'
  
  # Manuel tetikleme (test için)
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'

      - name: Bağımlılıkları yükle
        run: pip install -r scripts/requirements.txt

      - name: Playwright Chromium yükle
        run: python -m playwright install chromium --with-deps

      - name: Scraper çalıştır
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PYTHONUTF8: "1"
        run: python -X utf8 scripts/scrape_market.py

      - name: Log kaydet (hata durumunda)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-debug
          path: scripts/*.png
          retention-days: 1
